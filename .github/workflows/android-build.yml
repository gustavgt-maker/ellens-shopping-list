# Baut die App in der Cloud (GitHub Actions), führt alle Unit-Tests aus und stellt die
# Debug-APK als herunterladbares Artefakt bereit. Kein Android Studio nötig.
name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      # Das Android SDK ist auf den GitHub-Runnern vorinstalliert (ANDROID_HOME).
      - name: Android SDK prüfen
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -5

      # Robolectric lädt beim ersten Testlauf Android-Laufzeitdateien von Maven Central.
      # Zwischenspeichern vermeidet sporadische Download-Fehler.
      - name: Robolectric-Dateien zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Unit-Tests ausführen
        # Ein zweiter Versuch fängt reine Netzwerkfehler beim Robolectric-Download ab.
        run: ./gradlew --no-daemon testDebugUnitTest || ./gradlew --no-daemon testDebugUnitTest

      - name: Debug-APK bauen
        run: ./gradlew --no-daemon assembleDebug

      - name: Room-Schema ins Log schreiben
        if: always()
        run: find app/schemas -name "*.json" -print -exec cat {} \; || true

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ellens-shopping-list-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Room-Schema hochladen (bitte ins Repository übernehmen)
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/

      # Bei jedem erfolgreichen Build auf main: APK als direkt herunterladbare Release-Datei.
      - name: APK umbenennen
        if: github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk "EllensShoppingList-${{ github.run_number }}.apk"

      - name: Release mit APK veröffentlichen
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Ellen's Shopping List – Build ${{ github.run_number }}"
          body: |
            Automatisch gebaute Debug-APK (alle Unit-Tests bestanden).
            Auf dem Smartphone herunterladen und antippen, um sie zu installieren.
          files: EllensShoppingList-${{ github.run_number }}.apk
          make_latest: true
